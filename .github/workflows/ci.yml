name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/*.sh docker/entrypoint.sh tests/e2e/netns_test.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools iproute2 iptables iputils-ping
      - name: Ende-zu-Ende-Test (echte WireGuard-Tunnel in Netzwerk-Namespaces)
        run: sudo tests/e2e/netns_test.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t neuvpn .
      - run: docker run --rm --entrypoint neuvpn neuvpn --version

  # Real Tor network: is the exit really in Romania?
  tor-romania-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tor tor-geoipdb
      - run: python3 -m neuvpn tor start --timeout 300
      - run: python3 -m neuvpn tor status
      - run: python3 -m neuvpn check --socks 127.0.0.1:9055 --expect RO
      - run: python3 -m neuvpn tor new-ip
      - if: always()
        run: python3 -m neuvpn tor stop

  # Real Mac: setup script, desktop shortcuts, Safari + Chrome, phone via --share
  tor-romania-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/e2e/mac_test.sh

  # Real Android (emulator): Orbot, "Change exit" -> Romania, check IP
  orbot-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Neueste Orbot-Version laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/e2e/fetch_orbot.py orbot.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 tests/e2e/orbot_android.py orbot.apk
